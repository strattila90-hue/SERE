<script>
/* Ha a telefon "Asztali webhely" módban nyitja meg (≈980px széles nézet), visszaskálázzuk telefonos nézetre */
(function () {
  try {
    var coarse = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
    var w = window.innerWidth;
    if (coarse && w > 700 && (window.devicePixelRatio || 1) < 1.8 && screen.width < 900 || coarse && w > 700 && screen.width < 600) {
      var target = Math.min(430, Math.max(360, screen.width < 600 ? screen.width : 412));
      document.documentElement.style.zoom = (w / target).toFixed(3);
      document.documentElement.classList.add('deskfix');
    }
  } catch (e) {}
})();
</script>
