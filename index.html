<script>
/* Telefonos nézet biztosítása. Ha a telefon "Asztali webhely" módban (≈980px széles nézet) nyitja meg, visszaskálázzuk.
   Telepített appnál az első pillanatban a telefon még rossz méretet adhat, ezért az app később újra lefuttatja (SEREfit). */
(function () {
  var cur = '';
  window.SEREfit = function () {
    try {
      var de = document.documentElement, w = window.innerWidth, h = window.innerHeight;
      if (!w || !h) return false;
      var coarse = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
      var tall = h / w > 1.7 || (screen.height || 0) / (screen.width || 1) > 1.7;
      var z = '';
      if (coarse && w > 700 && (screen.width < 600 || tall)) {
        var target = Math.min(430, Math.max(360, screen.width < 600 ? screen.width : 412));
        z = (w / target).toFixed(3);
      }
      if (z === cur) return false;
      cur = z; de.style.zoom = z; de.classList.toggle('deskfix', !!z);
      return true;
    } catch (e) { return false; }
  };
  window.SEREfit();
})();
</script>
